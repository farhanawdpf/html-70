<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Else If condition</title>
</head>

<body>
    <script>
        var a = prompt("Please enter Number:");

        if (a >= 80) {
            document.write("A+");
        } else if (a >= 70) {
            document.write("A");
        } else if (a >= 60) {
            document.write("B");
        } else {
            document.write("F");
        }
    </script>
</body>

</html>
