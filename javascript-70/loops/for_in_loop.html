<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For In Loop</title>
</head>

<body>

    <script>
        let car = {
            name: 'BMW',
            model: 'M4',
            color: 'Black'
        }

        for (let l in car) {
            console.log(l + " :" + car[l]);
        }
    </script>
</body>

</html>
