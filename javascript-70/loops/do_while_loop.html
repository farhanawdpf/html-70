<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>First, it will work once, then it will check the condition.</h1>
    <script>
        // আগে একবার কাজ করবে, তারপর condition চেক করবে।
        //1,2,3,4,5......25
        var i = 4;
        do {
            document.write(i + "<br/>");
            i++;
        } while (i <= 25);
