<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #p2 {
            width: 200px;
            border: 2px solid gray;
            height: 100px;
            background-color: bisque;
        }
    </style>
</head>

<body>
    <p id="p2">Hello</p>
    <script>
        let a = 34;
        let b = 4;
        let sum = a + b;
        document.write(sum);
        document.getElementById("p2").innerHTML = sum;
    </script>
</body>

</html>
