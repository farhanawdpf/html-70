<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //number type
        let a = 23;
        let b = 2;
        let sum = (a + b);
        console.log(typeof sum);

        //string type
        let first_name = "Rakib";
        let last_name = "Ahmed";
        let full_name = first_name + " " + last_name;
        console.log(typeof full_name);
        //boolean = true / flase
        let p = 5;
        let q = 7
        let r = p < q;
        console.log(r);
        console.log(typeof r);
        //undefine
        let num;
        console.log(num);
        //null (no value)
        let nv = null;
        console.log(nv);
    </script>
</body>

</html>
