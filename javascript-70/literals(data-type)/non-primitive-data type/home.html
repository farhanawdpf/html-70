<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <button onclick="infoDetails()">submit</button>

    <script>
        // object literal
        let car = {
            model: 100,
            color: "red",
            name: "Toyota"
        }
        console.log(car);
        console.log(typeof car);
        document.write(car.model + "<br>" + car.color + "<br>" + car.name);
        document.write("<br>")
        //array
        let students = ["Sumi", "Lyies", "Polok", "Bappi", "Fahim"];
        let num = [2, 4, 78, 6765, 788]
        console.log(students[2]);
        document.write(students[2]);
        document.write("<br>");
        document.write(num[3]);
        document.write("<br>");
        //function
        function infoDetails() {
            alert("hello world");
        }

        infoDetails();
    </script>
</body>

</html>
