<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>constructor function</title>
</head>

<body>
  <p>
    Person is a constructor function.
    <br> <b>this.name</b> and <b>this.age</b>are properties <br>
    assigned to the new object. <br>
    this.greet is a method of the new object.
  </p>
  <h2> Constructors vs. Regular Functions:</h2>
  <p> Constructors are intended for creating objects, <br>
    while regular functions perform specific tasks.</p>

  <script>
    function Car(name, model) {
      this.name = name;
      this.model = model;
      this.speed = function () {
        document.write(this.name + this.model + "running first")
      }
    }

    let newCar = new Car("BMW", "i8");
    // document.write(newCar.model + " " + newCar.name);
    newCar.speed();
  </script>
</body>

</html>
