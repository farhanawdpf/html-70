<!DOCTYPE html>

<head>

    <title>anonymous function</title>
</head>

<body>
    <h1>function(){}</h1>
    <script>
        // An anonymous function is a function that does not have a name.

        let info = function (a, b) {
            return a + b;
        }
        document.write(info(3, 6));

        //     return a*a;
        // }

        // document.write(sqr(3))

        setTimeout(function () {
            document.write("print after 2 second")
        }, 2000);
    </script>
</body>

</html>
