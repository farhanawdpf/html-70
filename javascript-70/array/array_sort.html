<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Sort</title>
</head>

<body>
    <h1>Array Sort(serial maintain-a,b,c,d)</h1>
    <script>
        let letter = [5, "A", "F", "D", 9, 1, 2, 3, 8, 4];
        console.log(letter);
        letter.sort();
        console.log(letter);
        letter.reverse();
        console.log(letter);
        //number value
        let num = [47, 100, 1, 58, 25, 10]
        num.sort(function (x, y) {
            return x - y
        })

        sort(function (a, b) {
            return a - b
        })

        console.log(num);
    </script>
</body>

</html>
