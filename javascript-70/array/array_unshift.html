<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Unshift</title>
</head>

<body>
    <script>
        //add from first(opposite of push)
        var student = ["Sumi", "Meem", "Lyies", "Bappi", "Rakib"];

        console.log(student);
        student.unshift("Moin");
        console.log(student);
    </script>
</body>

</html>
