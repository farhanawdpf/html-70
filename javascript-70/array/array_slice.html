<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array slice</title>
</head>

<body>
    <h1>( start and end)</h1>
    <p> const numbers = [1, 2, 3, (4, 5,7,8),3]; <br>
        (4, 6)
        const slice1 = numbers.slice(1, 4); // Returns [2, 3, 4]<br>
        const slice2 = numbers.slice(2); // Returns [3, 4, 5]<br>
        const slice3 = numbers.slice(-2); // Returns [4, 5]<br>
    </p>
    <script>
        const numbers = ["A", "B", "D", "C", "E", "F", "G", "H"];
        console.log(numbers);
        console.log(numbers.slice(1, 6))
    </script>






</body>

</html>
