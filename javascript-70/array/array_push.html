<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Push</title>
</head>

<body>
    <script>
        //add from last
        var student = ["Sumi", "Meem", "Lyies", "Bappi", "Rakib"];
        console.log(student);
        student.push("Faim"); //add new element
        console.log(student);
        student.push("Ridoy", "Moin");
        console.log(student);
    </script>

</body>

</html>
